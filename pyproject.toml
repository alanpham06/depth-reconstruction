[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "depth-reconstruction"
version = "0.1.0"
description = "Sparse-to-dense depth completion on procedurally rendered ground truth."
requires-python = ">=3.11"

[tool.setuptools]
packages = ["arguments", "datasets", "eval", "export", "models", "plotting", "render", "utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
